name: Publish to npm

# Runs when you publish a GitHub release. Needs an npm automation token saved as the NPM_TOKEN secret,
# and "private": true removed from package.json once the package has a free name.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm record where the package was built (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node --test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
